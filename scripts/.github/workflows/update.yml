name: 每日更新台股投信買賣超

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取資料並產生網頁
        run: python scripts/fetch_twse_trust.py

      - name: 有變動才提交
        run: |
          git config user.name "tw-fund-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git push)
